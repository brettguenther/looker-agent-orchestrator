[project]
name = "looker-multi-agent"
version = "0.1.0"
description = "Multi-agent Looker orchestrator deployed to Agent Runtime and Gemini Enterprise"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "google-adk[a2a,gcp,otel-gcp]>=2.5.0,<3.0.0",
    "google-genai>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2024.11.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
